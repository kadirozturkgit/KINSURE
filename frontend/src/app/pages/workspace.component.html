<!-- Supply a consistent sidebar, responsive navigation, and signed-in workspace. -->
<div class="workspace">
  <aside class="sidebar">
    <a class="brand" routerLink="/app" aria-label="KINSURE ana sayfa">
      <img src="assets/images/logo.png" alt="KINSURE">
      <span>INSURANCE MANAGEMENT</span>
    </a>
    <div class="nav-caption">ÇALIŞMA ALANI</div>
    <nav aria-label="Ana menü">
      <a class="nav-link" routerLink="/app" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="active">
        <span class="nav-icon">⌂</span><span>Genel bakış</span>
      </a>
      <div class="nav-caption nav-caption-spaced">YÖNETİM</div>
      @for (item of navigation; track item.key) {
        <a class="nav-link" [routerLink]="['/app', item.key]" routerLinkActive="active">
          <span class="nav-icon">{{ item.icon }}</span><span>{{ item.label }}</span>
        </a>
      }
    </nav>
    <div class="sidebar-bottom">
      <div class="status-chip"><span></span> Sistem çalışıyor</div>
      <button class="profile-button" type="button" aria-label="Oturumu kapat" title="Oturumu kapat" (click)="logout()">
        <span class="avatar">{{ auth.username().slice(0, 1).toUpperCase() }}</span>
        <span class="profile-copy"><strong>{{ auth.username() }}</strong><small>Oturumu kapat</small></span>
        <span class="logout-icon">↗</span>
      </button>
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <div class="breadcrumb"><span>Çalışma alanı</span><span class="crumb-separator">/</span><strong>KINSURE</strong></div>
      <div class="topbar-right"><span class="today">{{ todayLabel }}</span><span class="topbar-avatar">{{ auth.username().slice(0, 1).toUpperCase() }}</span></div>
    </header>
    <section class="page-content"><router-outlet /></section>
  </main>
</div>
