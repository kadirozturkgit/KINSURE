services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinsure-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_DSN: oracle:1521/FREEPDB1
      LOG_DIRECTORY: /app/logs
      TZ: Europe/Istanbul
    volumes:
      - ./logs:/app/logs
    depends_on:
      oracle:
        condition: service_healthy
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim
    container_name: kinsure-oracle-23
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in backend/.env}
      APP_USER: ${DATABASE_USER:?Set DATABASE_USER in backend/.env}
      APP_USER_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in backend/.env}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  oracle-data:
    external: true
    name: kinsure-oracle-23-data